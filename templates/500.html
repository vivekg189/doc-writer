<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal Server Error - Legal Document Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full bg-gradient-to-br from-red-50 via-white to-amber-50 dark:from-slate-950 dark:via-slate-950 dark:to-slate-900 text-slate-800 dark:text-slate-100">
    <div class="min-h-screen flex items-center justify-center">
        <div class="text-center px-4">
            <h1 class="text-6xl font-bold text-red-500 mb-4">500</h1>
            <h2 class="text-2xl font-semibold mb-4">Internal Server Error</h2>
            <p class="text-slate-600 dark:text-slate-400 mb-8 max-w-md mx-auto">
                Something went wrong on our end while processing your request. Please try again or return to the home page.
            </p>
            <div class="flex gap-4 justify-center">
                <a href="/" class="inline-flex items-center gap-2 rounded-xl bg-gradient-to-r from-sky-500 to-indigo-600 text-white px-6 py-3 text-sm font-medium shadow-sm hover:shadow-md hover:from-sky-600 hover:to-indigo-700 transition-all">
                    🏠 Go Home
                </a>
                <button onclick="window.location.reload()" class="inline-flex items-center gap-2 rounded-xl bg-slate-200 dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-6 py-3 text-sm font-medium shadow-sm hover:bg-slate-300 dark:hover:bg-slate-700 transition-all">
                    🔄 Reload Page
                </button>
            </div>
        </div>
    </div>
</body>
</html>
